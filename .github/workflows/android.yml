# GeoStrand — Android uygulamasını bulutta derler (ücretsiz, GitHub Actions)
#
# Ne zaman çalışır: GitHub'da "main" dalına her yüklemede ya da Actions sekmesinden
# "Run workflow" ile elle.
#
# Ne üretir (Actions → bu çalıştırma → sayfanın altında Artifacts):
#   • geostrand-android-aab  → Google Play'e yüklenecek dosya (app-release.aab)
#   • geostrand-android-apk  → Telefonuna doğrudan kurup denemek için (app-debug.apk)
#
# İmza için GitHub deposunda Settings → Secrets and variables → Actions'a şunları ekle
# (değerler GITHUB-SECRETS.txt dosyasında):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Bunlar yoksa da derlenir ama .aab imzasız olur (Google Play kabul etmez).
name: Android uygulaması

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'store/**'
  workflow_dispatch:

jobs:
  android:
    # Sabit sürüm: "ubuntu-latest" Ekim 2026'da Ubuntu 26'ya geçti; 24.04'te Android SDK hazır kurulu gelir.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (platform 36)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "::error::Android SDK bulunamadı ($SDK). Çalıştırıcı görüntüsü değişmiş olabilir."
            exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "SDK hazır: $SDK"

      - name: Ortam bilgisi
        run: |
          node --version; npm --version; java -version 2>&1 | head -1
          ls -la package.json package-lock.json android/gradlew

      - name: Paketleri kur
        run: npm ci --no-audit --no-fund

      - name: Testler
        run: npm test

      - name: Oyun dosyalarını uygulamaya kopyala
        run: |
          npm run build:www
          npx cap sync android

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Kopyalarken araya girmiş boşluk/satır sonları temizlenir
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "İmza anahtarı bulundu ($(wc -c < "$RUNNER_TEMP/upload.jks") bayt): .aab imzalanacak"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yok: .aab imzasız olacak (Google Play için imza gerekir)"
          fi

      - name: Derle (AAB + APK)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug

      - name: Google Play dosyasını yükle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: geostrand-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Deneme dosyasını yükle (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: geostrand-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
