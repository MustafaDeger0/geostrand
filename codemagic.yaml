# GeoStrand — Codemagic ile bulutta derleme (Mac gerekmez)
# codemagic.io → GitHub ile giriş → depoyu ekle → bu dosya otomatik bulunur.
#
# iOS için önce (bir kez):
#   1) Apple Developer Program üyeliği (yıllık ücretli)
#   2) App Store Connect → Users and Access → Integrations → App Store Connect API → anahtar oluştur
#   3) Codemagic → Team settings → Integrations → Developer Portal → bu anahtarı "GeoStrand ASC" adıyla ekle
#   4) App Store Connect'te uygulamayı oluştur (Bundle ID: com.geostrand.enlemdenkacis)
# Ayrıntı: MAGAZA-REHBERI.md
workflows:
  ios-release:
    name: iOS → TestFlight / App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: GeoStrand ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.geostrand.enlemdenkacis
      node: 22
      xcode: latest
    scripts:
      - name: Paketleri kur
        script: npm ci
      - name: Oyun dosyalarını uygulamaya kopyala
        script: |
          npm run build:www
          npx cap sync ios
      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles
      - name: Derleme numarasını artır
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" ios/App/App.xcodeproj/project.pbxproj
      - name: IPA derle
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # İstersen Android'i de buradan derleyebilirsin (GitHub Actions yerine).
  # Codemagic → Team settings → Code signing identities → Android keystores →
  # geostrand-upload.jks dosyasını "geostrand_upload" adıyla yükle.
  android-release:
    name: Android → Google Play dosyası (.aab)
    max_build_duration: 40
    instance_type: linux_x2
    environment:
      android_signing:
        - geostrand_upload
      node: 22
      java: 21
    scripts:
      - name: Paketleri kur
        script: npm ci
      - name: Oyun dosyalarını uygulamaya kopyala
        script: |
          npm run build:www
          npx cap sync android
      - name: Derle
        script: |
          cd android
          chmod +x gradlew
          export ANDROID_KEYSTORE_PATH="$CM_KEYSTORE_PATH"
          export ANDROID_KEYSTORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$CM_KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$CM_KEY_PASSWORD"
          export VERSION_CODE=$((BUILD_NUMBER + 100))
          export VERSION_NAME="1.0.${BUILD_NUMBER}"
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
